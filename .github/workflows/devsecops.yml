name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"   # Mondays 02:30 UTC: new CVEs appear even when nobody commits
  workflow_dispatch:
    inputs:
      gate_mode:
        description: "report = never fail on findings | enforce = block on policy violations"
        type: choice
        options: [report, enforce]
        default: report

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: vaultnotes
  # Manual run input > repository variable GATE_MODE > "report".
  GATE_MODE: ${{ inputs.gate_mode || vars.GATE_MODE || 'report' }}

# Third-party actions are pinned to full commit SHAs (the comment shows the
# release). Tags can be force-pushed - that is how trivy-action was hijacked in
# March 2026 - a commit SHA cannot.
jobs:
  # ---------------------------------------------------------------- 1. build/test
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -q tests

  # ---------------------------------------------------------------- 2. secrets
  secrets-scan:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0            # scan the whole history, not just the tip
          persist-credentials: false
      - name: Install Gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: Scan git history
        run: |
          mkdir -p reports
          ./gitleaks git . --redact --no-banner --exit-code 0 \
            --report-format json --report-path reports/gitleaks-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: gitleaks-report
          path: reports/gitleaks-report.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------- 3. SAST
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Bandit
        run: pip install "bandit[sarif]==1.9.4"
      - name: Run Bandit (JSON for the gate, SARIF for the Security tab)
        run: |
          mkdir -p reports
          bandit -r app scripts -f json  -o reports/bandit-report.json --exit-zero
          bandit -r app scripts -f sarif -o reports/bandit.sarif       --exit-zero
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        # Needs a public repo (or GitHub Advanced Security) and a non-fork PR.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        continue-on-error: true
        with:
          sarif_file: reports/bandit.sarif
          category: bandit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bandit-report
          path: reports/bandit-report.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------- 4. SCA
  sca:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit pinned requirements
        # pip-audit exits 1 when it finds vulnerabilities; that is a finding,
        # not a tool failure, so only exit codes other than 1 stop the job.
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off \
            -f json -o reports/pip-audit-report.json || [ $? -eq 1 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: pip-audit-report
          path: reports/pip-audit-report.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------- 5. container
  container:
    name: Container (Hadolint + build + Trivy)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Lint Dockerfile (Hadolint)
        run: |
          mkdir -p reports
          docker run --rm -i hadolint/hadolint:v2.12.0 \
            hadolint --no-fail --format json - < Dockerfile > reports/hadolint-report.json

      - name: Build image
        run: docker build -t "${IMAGE_NAME}:ci" .

      - name: Smoke test the container
        env:
          # Optional repo secret (Settings > Secrets and variables > Actions).
          # Passed by name so the value never appears in the command line or
          # logs; the remediated app reads SECRET_KEY, the vulnerable one ignores it.
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          docker run -d --name smoke -e SECRET_KEY -p 8000:8000 "${IMAGE_NAME}:ci"
          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke
          docker rm -f smoke
          [ "$ok" = 1 ]

      - name: Trivy image scan (JSON for the gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: json
          output: reports/trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Trivy image scan (SARIF for the Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: sarif
          output: reports/trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        continue-on-error: true
        with:
          sarif_file: reports/trivy.sarif
          category: trivy

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: hadolint-report
          path: reports/hadolint-report.json
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: trivy-report
          path: reports/trivy-report.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------- 6. gate
  gate:
    name: Security gate
    needs: [secrets-scan, sast, sca, container]
    if: ${{ !cancelled() }}      # evaluate the gate even when a scan job failed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ env.GATE_MODE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true   # a missing artifact must reach the gate, which fails closed
        with:
          pattern: "*-report"
          merge-multiple: true
          path: reports
      - name: Evaluate security policy
        run: python scripts/security_gate.py --reports-dir reports --mode "${GATE_MODE}"

  # ---------------------------------------------------------------- 7. release
  publish:
    name: Publish image (only after an enforced, passing gate)
    needs: gate
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.gate.result == 'success' && needs.gate.outputs.mode == 'enforce'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build and push to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build -t "${image}:${GITHUB_SHA}" -t "${image}:latest" .
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
